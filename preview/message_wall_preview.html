<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>留言墙预览</title>
  <link rel="stylesheet" href="./secretbase-preview.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

    :root{
      --bg:#fff;
      --bg-top:#fff;
      --surface:rgba(255,255,255,.94);
      --surface-strong:#fffdfd;
      --line:#f2eaee;
      --line-soft:#f6eff2;
      --ink:#1d1d1f;
      --muted:#8f8991;
      --pink:#ff6f95;
      --pink-soft:#ffe3eb;
      --shadow:0 2px 10px rgba(40,24,32,.05);
      --radius-xl:22px;
      --radius-lg:18px;
      --radius-md:14px;
      --phone-width:393px;
      --phone-height:852px;
      --font-body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      --font-heading:"Playfair Display","Noto Serif SC","PingFang SC","Microsoft YaHei",serif;
      --font-number:var(--font-body);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:#fff;
      font-family:var(--font-body);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      font-kerning:normal;
    }
    body{min-height:100vh;padding:24px 12px;display:flex;justify-content:center}

    .phone{
      width:min(100%,var(--phone-width));
      min-height:var(--phone-height);
      background:#fff;
      border-radius:38px;
      border:1px solid rgba(255,255,255,.88);
      overflow:hidden;
      box-shadow:0 14px 36px rgba(42,26,35,.10);
      position:relative;
    }

    .scroll{
      min-height:100%;
      background:#fff;
      padding:calc(18px + env(safe-area-inset-top)) 20px calc(112px + env(safe-area-inset-bottom));
      overflow:auto;
    }

    /* Keep this preview route aligned with the white Android message-wall canvas. */
    body.theme-secondary{
      --bg:#fff !important;
      --bg-top:#fff !important;
      background:#fff !important;
    }
    .theme-secondary .phone,
    .theme-secondary .scroll{
      background:#fff !important;
    }

    .topbar{
      display:grid;
      grid-template-columns:1fr 44px;
      align-items:center;
      margin-bottom:18px;
    }

    .topbar h1{
      margin:0;
      text-align:left;
      font-size:21px;
      font-family:var(--font-heading);
      font-weight:700;
      letter-spacing:0;
    }

    .icon-circle{
      width:44px;
      height:44px;
      border-radius:50%;
      border:0;
      background:transparent;
      display:grid;
      place-items:center;
      box-shadow:none;
      color:var(--pink);
      cursor:pointer;
      backdrop-filter:blur(12px);
    }

    .icon-circle.back{color:var(--ink)}
    .icon-circle svg{width:22px;height:22px;display:block}

    .empty-state{
      padding:30px 8px 12px;
      text-align:center;
    }

    .empty-ill{
      width:100%;
      height:136px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:14px;
    }

    .empty-ill img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .empty-state h3{
      margin:0 0 8px;
      font-size:22px;
      font-family:var(--font-heading);
      font-weight:700;
    }

    .empty-state p{
      margin:0 0 16px;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
    }

    .primary-btn{
      border:none;
      background:var(--pink);
      color:#fff;
      font:700 16px/1 var(--font-body);
      padding:12px 20px;
      border-radius:999px;
      cursor:pointer;
    }

    .feed{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .message-card{
      background:var(--surface);
      border:0;
      border-radius:var(--radius-xl);
      box-shadow:none;
      padding:16px;
    }

    .message-head{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      border:1px solid #f2eaee;
      background:#fff;
      overflow:hidden;
      flex:none;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .author{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:4px;
      padding-top:1px;
    }

    .author-name{
      font-size:17px;
      font-family:var(--font-heading);
      font-weight:600;
      line-height:1.2;
      letter-spacing:-.008em;
    }

    .author-time{
      font-size:12px;
      line-height:1.4;
      color:var(--muted);
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }
    .read-status{margin-left:6px;font-weight:600}
    .read-status.unread{color:var(--pink)}

    .text-btn{
      border:none;
      background:none;
      color:var(--muted);
      font:inherit;
      cursor:pointer;
      padding:0;
    }

    .more-wrap{position:relative}
    .more-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      font-size:16px;
      letter-spacing:.02em;
      line-height:1;
      color:rgba(143,137,145,.72);
    }

    .more-menu{
      position:absolute;
      right:0;
      top:34px;
      width:118px;
      padding:8px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#fff;
      box-shadow:0 14px 32px rgba(61,30,40,.10);
      display:none;
      z-index:9;
    }

    .more-menu.show{display:block}
    .more-menu button{
      width:100%;
      text-align:left;
      padding:10px 12px;
      border-radius:12px;
      border:none;
      background:none;
      cursor:pointer;
      font:500 13px/1.2 var(--font-body);
      color:var(--ink);
    }

    .more-menu button:hover{background:#fff6f8}
    .more-menu button.danger{color:var(--pink)}

    .message-content{
      margin:12px 0 0;
      font-size:15px;
      line-height:1.72;
      font-weight:500;
    }

    .message-images{
      width:100%;
      margin-top:12px;
      display:grid;
      gap:6px;
    }

    .message-images > div{min-width:0;position:relative}
    .message-images.cols-1{grid-template-columns:minmax(0,1fr)}
    .message-images.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .message-images.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}

    .media-overflow{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      background:rgba(26,20,24,.48);
      color:#fff;
      font-size:24px;
      font-weight:700;
    }

    .media{
      width:100%;
      min-width:0;
      overflow:hidden;
      border-radius:16px;
      aspect-ratio:1 / 1;
      position:relative;
      border:1px solid var(--line-soft);
      background:#f8f5f7;
      cursor:pointer;
    }

    .media.single{
      aspect-ratio:1.5;
      border-radius:18px;
    }

    .media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .mock-photo{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .mock-photo::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 78% 18%, rgba(255,255,255,.42), transparent 30%),
        radial-gradient(circle at 24% 68%, rgba(255,255,255,.16), transparent 28%);
    }

    .mock-photo::after{
      content:attr(data-label);
      position:absolute;
      left:10px;
      top:10px;
      color:rgba(255,255,255,.94);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
    }

    .mock-blossom{background:linear-gradient(135deg,#7eb5f0,#ffcde2)}
    .mock-sunset-gold{background:linear-gradient(135deg,#7a8fd6,#ffb56b)}
    .mock-sunset-shore{background:linear-gradient(135deg,#f5b48a,#7ec8e3)}
    .mock-note{background:linear-gradient(135deg,#f6d6ff,#ffd6e8)}

    .message-actions{
      margin-top:8px;
      display:flex;
      align-items:center;
      gap:16px;
      color:var(--muted);
    }

    .message-actions button,
    .reply-toggle{
      border:none;
      background:none;
      min-height:44px;
      padding:0 2px;
      display:flex;
      align-items:center;
      gap:6px;
      color:inherit;
      font:500 13px/1.2 var(--font-body);
      cursor:pointer;
      font-variant-numeric:tabular-nums;
    }
    .message-actions button{flex:none;justify-content:flex-start}

    .message-actions svg{width:18px;height:18px}
    .message-actions .heart svg{color:var(--pink)}
    .message-actions .heart{
      transition:color .18s ease;
    }
    .message-actions .heart:active .heart-visual{
      transform:scale(.9);
    }
    .message-actions .heart.liked{
      color:var(--pink);
    }
    .message-actions .heart.liked svg{
      fill:currentColor;
    }

    .heart-visual{
      width:26px;
      height:26px;
      position:relative;
      display:grid;
      place-items:center;
      transition:transform .14s cubic-bezier(.22,1,.36,1);
    }

    .heart-visual svg{
      position:relative;
      z-index:2;
      width:18px;
      height:18px;
      transition:fill .18s ease,color .18s ease;
    }

    .heart-ring,
    .heart-particles{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .heart-ring{
      border:1.5px solid var(--pink);
      border-radius:50%;
      opacity:0;
      transform:scale(.28);
    }

    .heart-particles i{
      --angle:0deg;
      position:absolute;
      top:50%;
      left:50%;
      width:4px;
      height:4px;
      margin:-2px;
      border-radius:50%;
      background:var(--pink);
      opacity:0;
      transform:rotate(var(--angle)) translateY(-5px) scale(.8);
    }

    .heart-particles i:nth-child(1){--angle:0deg}
    .heart-particles i:nth-child(2){--angle:45deg}
    .heart-particles i:nth-child(3){--angle:90deg}
    .heart-particles i:nth-child(4){--angle:135deg}
    .heart-particles i:nth-child(5){--angle:180deg}
    .heart-particles i:nth-child(6){--angle:225deg}
    .heart-particles i:nth-child(7){--angle:270deg}
    .heart-particles i:nth-child(8){--angle:315deg}

    .message-actions .heart.pop .heart-visual svg{
      animation:heart-pop .43s both;
    }
    .message-actions .heart.pop .heart-ring{
      animation:heart-ring .39s cubic-bezier(.22,1,.36,1) both;
    }
    .message-actions .heart.pop .heart-particles i{
      animation:heart-spark .39s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes heart-pop{
      0%{transform:scale(.72)}
      33%{transform:scale(1.28)}
      63%{transform:scale(.94)}
      100%{transform:scale(1)}
    }
    @keyframes heart-ring{
      0%{opacity:.48;transform:scale(.28)}
      100%{opacity:0;transform:scale(1.08)}
    }
    @keyframes heart-spark{
      0%{opacity:.8;transform:rotate(var(--angle)) translateY(-5px) scale(.85)}
      100%{opacity:0;transform:rotate(var(--angle)) translateY(-13px) scale(.2)}
    }

    .comment-preview{
      margin-top:2px;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:7px;
      border-radius:12px;
      background:#fff5f3;
      cursor:pointer;
    }

    .comment-preview-all{font-size:12px;color:var(--muted);font-weight:500}
    .comment-preview-line{display:flex;align-items:flex-start;gap:0;font-size:13px;line-height:1.5}
    .comment-preview-name{font-weight:700;white-space:nowrap}
    .comment-preview-target{color:var(--ink);white-space:nowrap}
    .comment-preview-text{min-width:0;margin-left:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

    .moment-reply-bar{
      position:fixed;
      left:50%;
      bottom:78px;
      transform:translateX(-50%);
      width:min(calc(100% - 24px),369px);
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      border-radius:22px;
      background:var(--surface-strong);
      box-shadow:0 8px 28px rgba(55,31,39,.16);
      z-index:80;
    }
    .moment-reply-bar textarea{flex:1;min-height:42px;max-height:88px;resize:none;border:0;outline:0;border-radius:16px;background:#fff5f3;padding:10px 12px;color:var(--ink);font:500 14px/1.45 var(--font-body)}
    .moment-reply-bar .cancel-reply{width:40px;height:40px;color:var(--muted);backdrop-filter:none}
    .moment-send{min-width:52px;height:44px;border:0;background:transparent;color:rgba(143,137,145,.58);font:700 14px/1 var(--font-body);cursor:pointer}
    .moment-send.active{color:var(--pink)}

    .reply-item{
      display:flex;
      align-items:flex-start;
      gap:9px;
      padding:3px 0;
      border-radius:10px;
      cursor:pointer;
      transition:background .16s ease;
    }
    .reply-item:active{background:rgba(255,111,149,.05)}
    .reply-avatar{width:28px;height:28px;flex:none;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--line)}
    .reply-avatar img{width:100%;height:100%;display:block;object-fit:cover}
    .reply-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}

    .reply-meta{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .reply-name{
      font-size:14px;
      font-family:var(--font-heading);
      font-weight:700;
      color:var(--ink);
    }

    .reply-target{
      font-size:11px;
      font-weight:500;
      color:rgba(255,111,149,.84);
    }

    .reply-time{
      font-size:11px;
      color:var(--muted);
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }

    .reply-content{
      font-size:14px;
      line-height:1.58;
      color:#45464d;
    }

    .reply-item button.delete{
      border:none;
      background:none;
      color:var(--muted);
      font-size:11px;
      cursor:pointer;
      padding:0;
    }

    .reply-toggle{
      width:max-content;
      padding:7px 2px;
      border-radius:999px;
    }

    .reply-box{
      margin-top:10px;
      border-radius:18px;
      background:#fff7f4;
      border:0;
      padding:10px 12px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .reply-box textarea,
    .edit-sheet textarea{
      width:100%;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      padding:0;
      color:var(--ink);
      font:500 15px/1.5 var(--font-body);
    }

    .reply-box textarea{min-height:22px;flex:1}
    .reply-box textarea::placeholder,
    .edit-sheet textarea::placeholder{color:var(--muted)}

    .reply-actions{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
      margin-top:0;
    }

    .reply-send{
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#f0eaed;
      color:var(--muted);
      cursor:pointer;
    }

    .reply-send.active{
      background:var(--pink);
      color:#fff;
    }

    .reply-send svg{width:17px;height:17px}

    .comments-overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(29,25,28,.34);
      z-index:100;
    }

    .comments-overlay.show{display:flex}
    .comments-sheet{
      width:min(100%,393px);
      height:min(82vh,700px);
      display:flex;
      flex-direction:column;
      background:var(--surface-strong);
      border-radius:24px 24px 0 0;
      overflow:hidden;
      box-shadow:0 -14px 40px rgba(42,24,32,.14);
    }
    .comments-head{display:flex;align-items:center;padding:12px 10px 10px 20px;border-bottom:1px solid var(--line)}
    .comments-head strong{flex:1;font-size:16px}
    .comments-close{color:var(--muted);backdrop-filter:none}
    .comments-list{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:18px}
    .comments-list .reply-item{cursor:default}
    .comments-empty{margin:auto;color:var(--muted);font-size:13px}
    .comments-composer{display:flex;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface-strong)}
    .comments-composer textarea{flex:1;min-height:42px;max-height:96px;resize:none;border:0;outline:0;border-radius:18px;background:#fff6f7;padding:10px 13px;color:var(--ink);font:500 14px/1.45 var(--font-body)}
    .confirm-overlay{z-index:120}

    .viewer,
    .edit-overlay,
    .confirm-overlay{
      position:fixed;
      inset:0;
      background:rgba(18,17,21,.78);
      display:none;
      align-items:center;
      justify-content:center;
      padding:0;
      z-index:99;
    }

    .viewer.show,
    .edit-overlay.show,
    .confirm-overlay.show{display:flex}

    .viewer-shell{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .viewer-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:#fff;
      font-weight:700;
      padding:22px 18px 0;
    }

    .viewer-stage{
      position:relative;
      width:100%;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#18151b;
      overflow:hidden;
    }

    .viewer-stage .media{
      width:100%;
      height:100%;
      border:none;
      border-radius:0;
      background:transparent;
      cursor:default;
    }

    .viewer-stage .media img{object-fit:contain}
    .viewer-stage .mock-photo{
      inset:24px;
      border-radius:28px;
    }

    .viewer-nav{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.16);
      color:#fff;
      cursor:pointer;
      font-size:18px;
    }

    .viewer-nav.prev{left:12px}
    .viewer-nav.next{right:12px}

    .sheet{
      width:min(100%,408px);
      border-radius:20px;
      background:#fffdfc;
      box-shadow:0 18px 44px rgba(33,18,24,.20);
      padding:18px;
    }

    .sheet h3{
      margin:0 0 10px;
      font-size:20px;
    }

    .sheet p{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.6;
    }

    .sheet-actions{
      display:flex;
      justify-content:flex-end;
      gap:12px;
      margin-top:12px;
    }

    .hidden{display:none!important}

    .main-tab-nav{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      padding:6px 10px calc(6px + env(safe-area-inset-bottom));
      border-radius:26px 26px 0 0;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.96);
      box-shadow:0 -4px 14px rgba(58,39,46,.04);
      z-index:20;
    }

    .main-tab-item{
      border:0;
      background:transparent;
      color:var(--muted);
      font:700 12px/16px var(--font-body);
      padding:4px;
      cursor:pointer;
    }

    .main-tab-item.active{
      color:var(--pink);
      font-weight:800;
    }

    .main-tab-item img{ opacity:.5; }
    .main-tab-item.active img{ opacity:1; }

    .main-tab-item img{
      display:block;
      width:36px;
      height:36px;
      margin:0 auto 2px;
      object-fit:contain;
    }
  </style>
</head>
<body class="theme-secondary">
  <div class="phone">
    <div class="scroll">
      <div class="topbar">
        <h1>留言墙</h1>
        <button class="icon-circle" id="openEditorBtn" type="button" title="写留言" aria-label="写留言">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20H21"/><path d="M16.5 3.5A2.1 2.1 0 0 1 19.5 6.5L8 18L3 19L4 14L16.5 3.5Z"/></svg>
        </button>
      </div>

      <section class="empty-state hidden" id="emptyState">
        <div class="empty-ill">
          <img src="../app/src/main/res/drawable-nodpi/home_couple_hero.webp?v=20260710-new-hero" alt="小羊和小耶插画" />
        </div>
        <h3>这里还没有留言</h3>
        <p>写下第一句只属于我们的悄悄话吧</p>
        <button class="primary-btn" id="emptyWriteBtn" type="button">写留言</button>
      </section>

      <section class="feed" id="feed"></section>
    </div>
    <nav class="main-tab-nav">
      <button class="main-tab-item" type="button" data-main-tab="./homepage_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_home_plan_b.png?v=20261003-icon-crop" alt="">首页</button>
      <button class="main-tab-item active" type="button" data-main-tab="./message_wall_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_message_wall_plan_b.png?v=20261003-icon-crop" alt="">留言墙</button>
      <button class="main-tab-item" type="button" data-main-tab="./wish_list.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_wishlist_plan_b.png?v=20261003-icon-crop" alt="">愿望清单</button>
      <button class="main-tab-item" type="button" data-main-tab="./anniversary.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_anniversary_plan_b.png?v=20261003-icon-crop" alt="">纪念日</button>
    </nav>
  </div>

  <div class="viewer" id="viewer">
    <div class="viewer-shell">
      <div class="viewer-top">
        <button class="icon-circle" type="button" id="viewerClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 6L18 18"/><path d="M18 6L6 18"/></svg>
        </button>
        <div id="viewerCount">1 / 1</div>
        <div style="width:44px"></div>
      </div>
      <div class="viewer-stage" id="viewerStage"></div>
    </div>
  </div>

  <div class="moment-reply-bar hidden" id="replyBar">
    <button class="icon-circle cancel-reply" id="commentsClose" type="button" aria-label="取消评论">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18"/><path d="M18 6L6 18"/></svg>
    </button>
    <textarea id="commentsInput" maxlength="300" rows="1" placeholder="评论…"></textarea>
    <button class="moment-send" id="commentsSend" type="button" onclick="sendActiveComment()">发送</button>
  </div>

  <div class="edit-overlay" id="editOverlay">
    <div class="sheet edit-sheet">
      <h3>编辑留言</h3>
      <textarea id="editInput" maxlength="500" placeholder="把这句心里话再润一润…"></textarea>
      <div class="sheet-actions">
        <button class="text-btn" type="button" id="editCancel">取消</button>
        <button class="primary-btn" type="button" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="sheet">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="sheet-actions">
        <button class="text-btn" type="button" id="confirmCancel">取消</button>
        <button class="primary-btn" type="button" id="confirmOk">删除</button>
      </div>
    </div>
  </div>

  <script>
    const currentUserId = "sheep";
    const currentUserName = "小羊";
    const MESSAGE_STORAGE_KEY = "secretbase-preview-messages-v3";
    const PENDING_MESSAGE_KEY = "secretbase-preview-pending-message-v1";
    const LIKED_STORAGE_KEY = "secretbase-preview-liked-messages-v1";
    const avatars = {
      sheep: "../app/src/main/res/drawable-nodpi/avatar_sheep.png?v=20261003-avatar-v2",
      chick: "../app/src/main/res/drawable-nodpi/avatar_chick.png?v=20261003-avatar-v2"
    };

    let activeReplyMessageId = null;
    let replyText = "";
    let expandedReplyIds = new Set();
    let likedMessageIds = new Set(JSON.parse(localStorage.getItem(LIKED_STORAGE_KEY) || "[]"));
    let poppingLikeId = null;
    let editingMessageId = null;
    let viewerState = { open: false, messageId: null, index: 0 };
    let activeCommentsMessageId = null;
    let replyLongPressTimer = null;
    let suppressReplyClick = false;
    let confirmState = null;

    const now = Date.now();
    let messages = [
      {
        id: "message-sheep-blossom",
        authorId: "sheep",
        authorName: "小羊",
        content: "今天看到一朵超美的樱花，第一时间就想分享给你。",
        imagePaths: [
          "mock://blossom-sky",
          "mock://sunset-gold",
          "mock://sunset-shore",
          "mock://desk",
          "mock://bread",
          "mock://library",
          "mock://sea",
          "mock://coffee",
          "mock://forest"
        ],
        createdAt: now - 10 * 60 * 1000,
        updatedAt: null,
        isRead: true,
        readAt: now - 10 * 60 * 1000,
        counterpartReadAt: null,
        replies: [
          {
            id: "reply-chick-blossom",
            messageId: "message-sheep-blossom",
            authorId: "chick",
            authorName: "小耶",
            content: "好想和你一起去看，光是照片就已经心动啦。",
            createdAt: now - 5 * 60 * 1000,
            isRead: false,
            readAt: null
          }
        ]
      },
      {
        id: "message-chick-sunset",
        authorId: "chick",
        authorName: "小耶",
        content: "一起去看了日落和海，好治愈呀。",
        imagePaths: ["mock://sunset-gold", "mock://sunset-shore"],
        createdAt: now - 16 * 60 * 60 * 1000,
        updatedAt: null,
        isRead: false,
        readAt: null,
        counterpartReadAt: now - 15 * 60 * 60 * 1000,
        replies: []
      },
      {
        id: "message-sheep-morning",
        authorId: "sheep",
        authorName: "小羊",
        content: "早安，新的一天也要元气满满哦。",
        imagePaths: [],
        createdAt: now - 32 * 60 * 60 * 1000,
        updatedAt: null,
        isRead: true,
        readAt: now - 32 * 60 * 60 * 1000,
        counterpartReadAt: now - 28 * 60 * 60 * 1000,
        replies: [
          { id: "reply-1", messageId: "message-sheep-morning", authorId: "sheep", authorName: "小羊", content: "记得喝温水，别空着肚子出门。", createdAt: now - 31 * 60 * 60 * 1000, isRead: true, readAt: now - 31 * 60 * 60 * 1000 },
          { id: "reply-2", messageId: "message-sheep-morning", authorId: "chick", authorName: "小耶", content: "收到收到，今天也会很想你。", createdAt: now - 30 * 60 * 60 * 1000, isRead: true, readAt: now - 29 * 60 * 60 * 1000 },
          { id: "reply-3", messageId: "message-sheep-morning", authorId: "sheep", authorName: "小羊", content: "那我等你下班，晚上一起吃小蛋糕。", createdAt: now - 29 * 60 * 60 * 1000, isRead: true, readAt: now - 29 * 60 * 60 * 1000 },
          { id: "reply-4", messageId: "message-sheep-morning", authorId: "chick", authorName: "小耶", content: "好呀，想吃奶油草莓味的！", createdAt: now - 28 * 60 * 60 * 1000, isRead: true, readAt: now - 28 * 60 * 60 * 1000 }
        ]
      },
      {
        id: "message-chick-text",
        authorId: "chick",
        authorName: "小耶",
        content: "回家路上给你带了热乎乎的小甜点，等会记得开门收惊喜。",
        imagePaths: [],
        createdAt: now - 46 * 60 * 60 * 1000,
        updatedAt: null,
        isRead: false,
        readAt: null,
        counterpartReadAt: now - 45 * 60 * 60 * 1000,
        replies: []
      }
    ];

    try {
      const storedMessages = JSON.parse(localStorage.getItem(MESSAGE_STORAGE_KEY) || "null");
      if (Array.isArray(storedMessages)) messages = storedMessages;
    } catch (_) {}

    try {
      const pendingMessage = JSON.parse(localStorage.getItem(PENDING_MESSAGE_KEY) || "null");
      if (pendingMessage && (pendingMessage.content || pendingMessage.imagePaths?.length)) {
        messages.unshift({
          id: `message-${crypto.randomUUID()}`,
          authorId: currentUserId,
          authorName: currentUserName,
          content: String(pendingMessage.content || "").slice(0, 500),
          imagePaths: Array.isArray(pendingMessage.imagePaths) ? pendingMessage.imagePaths.slice(0, 9) : [],
          createdAt: Number(pendingMessage.createdAt) || Date.now(),
          updatedAt: null,
          isRead: true,
          readAt: Date.now(),
          counterpartReadAt: null,
          replies: []
        });
      }
      localStorage.removeItem(PENDING_MESSAGE_KEY);
    } catch (_) {
      localStorage.removeItem(PENDING_MESSAGE_KEY);
    }

    function persistMessages() {
      localStorage.setItem(MESSAGE_STORAGE_KEY, JSON.stringify(messages));
    }

    persistMessages();

    const feedEl = document.getElementById("feed");
    const emptyStateEl = document.getElementById("emptyState");
    const viewerEl = document.getElementById("viewer");
    const viewerStageEl = document.getElementById("viewerStage");
    const viewerCountEl = document.getElementById("viewerCount");
    const replyBarEl = document.getElementById("replyBar");
    const commentsInputEl = document.getElementById("commentsInput");
    const commentsSendEl = document.getElementById("commentsSend");
    const editOverlayEl = document.getElementById("editOverlay");
    const editInputEl = document.getElementById("editInput");
    const confirmOverlayEl = document.getElementById("confirmOverlay");
    const confirmTitleEl = document.getElementById("confirmTitle");
    const confirmTextEl = document.getElementById("confirmText");

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const diff = Date.now() - timestamp;
      const minute = 60 * 1000;
      const hour = 60 * minute;
      if (diff < minute) return "刚刚";
      if (diff < hour) return `${Math.floor(diff / minute)} 分钟前`;
      const nowDate = new Date();
      if (date.toDateString() === nowDate.toDateString()) {
        return date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
      }
      const yesterday = new Date(nowDate);
      yesterday.setDate(nowDate.getDate() - 1);
      if (date.toDateString() === yesterday.toDateString()) {
        return `昨天 ${date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false })}`;
      }
      return `${date.getMonth() + 1}月${date.getDate()}日 ${date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false })}`;
    }

    function visibleReplies(message) {
      const expanded = expandedReplyIds.has(message.id);
      const visible = expanded || message.replies.length <= 3
        ? message.replies
        : message.replies.slice(0, 3);
      return visible.map(reply => ({
        reply,
        index: message.replies.findIndex(item => item.id === reply.id)
      }));
    }

    function imageCols(count) {
      if (count === 1) return 1;
      if (count === 2) return 2;
      if (count === 3) return 3;
      if (count === 4) return 2;
      return 3;
    }

    function mockClass(path) {
      if (path === "mock://blossom-sky") return ["mock-blossom", "樱花"];
      if (path === "mock://sunset-gold") return ["mock-sunset-gold", "日落"];
      if (path === "mock://sunset-shore") return ["mock-sunset-shore", "海边"];
      return ["mock-note", "照片"];
    }

    function renderMedia(path, single = false) {
      const cls = single ? "media single" : "media";
      if (path.startsWith("mock://")) {
        const [theme, label] = mockClass(path);
        return `<div class="${cls}"><div class="mock-photo ${theme}" data-label="${label}"></div></div>`;
      }
      return `<div class="${cls}"><img src="${path}" alt="留言图片"></div>`;
    }

    function renderFeed() {
      if (!messages.length) {
        emptyStateEl.classList.remove("hidden");
        feedEl.innerHTML = "";
        return;
      }
      emptyStateEl.classList.add("hidden");
      feedEl.innerHTML = messages.map(message => {
        const replies = visibleReplies(message);
        const previewImages = message.imagePaths.slice(0, 4);
        const hiddenImageCount = Math.max(0, message.imagePaths.length - previewImages.length);
        const liked = likedMessageIds.has(message.id);
        const cols = imageCols(previewImages.length);
        const metaBits = [
          formatTime(message.createdAt),
          message.updatedAt ? "已编辑" : ""
        ].filter(Boolean).join(" · ");
        const readStatus = message.authorId === currentUserId
          ? (message.counterpartReadAt ? "对方已读" : "对方未读")
          : (!message.isRead ? "新留言" : "");
        return `
          <article class="message-card" data-message-id="${message.id}">
            <div class="message-head">
              <div class="avatar"><img src="${avatars[message.authorId]}" alt="${message.authorName}头像"></div>
              <div class="author">
                <div class="author-name">${message.authorName}</div>
                <div class="author-time">${metaBits}${readStatus ? `<span class="read-status ${!message.isRead && message.authorId !== currentUserId ? "unread" : ""}">${readStatus}</span>` : ""}</div>
              </div>
              <div class="more-wrap">
                <button class="text-btn more-btn" type="button" data-more="${message.id}" aria-label="更多操作">•••</button>
                <div class="more-menu" id="menu-${message.id}">
                  ${message.authorId === currentUserId ? `
                    <button type="button" data-edit="${message.id}">编辑留言</button>
                    <button class="danger" type="button" data-delete-message="${message.id}">删除留言</button>
                  ` : `
                    <button type="button" data-open-comments="${message.id}">回复留言</button>
                  `}
                </div>
              </div>
            </div>

            ${message.content ? `<div class="message-content">${escapeHtml(message.content)}</div>` : ""}

            ${message.imagePaths.length ? `
              <div class="message-images cols-${cols}">
                ${previewImages.map((path, index) => `<div data-open-viewer="${message.id}" data-image-index="${index}">${renderMedia(path, message.imagePaths.length === 1)}${hiddenImageCount && index === previewImages.length - 1 ? `<span class="media-overflow">+${hiddenImageCount}</span>` : ""}</div>`).join("")}
              </div>` : ""}

            <div class="message-actions">
              <button class="heart ${liked ? "liked" : ""} ${poppingLikeId === message.id ? "pop" : ""}" type="button" data-like="${message.id}" aria-label="赞">
                <span class="heart-visual">
                  <span class="heart-ring"></span>
                  <span class="heart-particles">${Array.from({length:8}, () => "<i></i>").join("")}</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61A5.5 5.5 0 0 0 13.06 4.6L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>
                </span>
                <span>赞</span>
              </button>
              <button type="button" data-open-comments="${message.id}" aria-label="评论">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5C21 16.2 16.7 20 11.5 20C10 20 8.6 19.7 7.3 19.1L3 20L4 15.9C3.4 14.6 3 13.1 3 11.5C3 6.8 7.3 3 12.5 3C17.7 3 22 6.8 22 11.5Z"/></svg>
                <span>${message.replies.length ? `评论 ${message.replies.length}` : "评论"}</span>
              </button>
            </div>

            ${replies.length ? `
              <div class="comment-preview" data-open-comments="${message.id}">
                ${replies.map(({ reply }) => `<div class="comment-preview-line" ${reply.authorId === currentUserId ? `data-own-reply="${reply.id}"` : ""}><span class="comment-preview-name">${reply.authorName}</span><span class="comment-preview-target">：</span><span class="comment-preview-text">${escapeHtml(reply.content)}</span></div>`).join("")}
                ${message.replies.length > 3 ? `<button class="reply-toggle" type="button" data-toggle-replies="${message.id}">${expandedReplyIds.has(message.id) ? "收起评论" : `查看全部 ${message.replies.length} 条评论`}</button>` : ""}
              </div>` : ""}
          </article>
        `;
      }).join("");
    }

    function render() {
      renderFeed();
      updateViewer();
      updateReplyBar();
      updateEditSheet();
    }

    function markMessageRead(messageId) {
      const message = messages.find(item => item.id === messageId);
      if (!message) return;
      if (message.authorId !== currentUserId) {
        message.isRead = true;
        message.readAt = Date.now();
      }
      message.replies.forEach(reply => {
        if (reply.authorId !== currentUserId) {
          reply.isRead = true;
          reply.readAt = Date.now();
        }
      });
      render();
    }

    function openViewer(messageId, index) {
      viewerState = { open: true, messageId, index };
      markMessageRead(messageId);
      updateViewer();
    }

    function updateViewer() {
      if (!viewerState.open) {
        viewerEl.classList.remove("show");
        viewerStageEl.innerHTML = "";
        return;
      }
      const message = messages.find(item => item.id === viewerState.messageId);
      if (!message || !message.imagePaths.length) {
        viewerState.open = false;
        viewerEl.classList.remove("show");
        return;
      }
      const total = message.imagePaths.length;
      viewerState.index = Math.max(0, Math.min(viewerState.index, total - 1));
      viewerCountEl.textContent = `${viewerState.index + 1} / ${total}`;
      viewerStageEl.innerHTML = `
        ${total > 1 ? `<button class="viewer-nav prev" type="button" ${viewerState.index === 0 ? "disabled" : ""}>‹</button>` : ""}
        ${renderMedia(message.imagePaths[viewerState.index], true)}
        ${total > 1 ? `<button class="viewer-nav next" type="button" ${viewerState.index === total - 1 ? "disabled" : ""}>›</button>` : ""}
      `;
      viewerEl.classList.add("show");
    }

    function openComments(messageId) {
      activeCommentsMessageId = messageId;
      activeReplyMessageId = messageId;
      replyText = "";
      markMessageRead(messageId);
      requestAnimationFrame(() => commentsInputEl.focus());
    }

    function closeComments() {
      activeCommentsMessageId = null;
      activeReplyMessageId = null;
      replyText = "";
      updateReplyBar();
    }

    function updateReplyBar() {
      if (!activeCommentsMessageId) {
        replyBarEl.classList.add("hidden");
        commentsInputEl.value = "";
        return;
      }
      const message = messages.find(item => item.id === activeCommentsMessageId);
      if (!message) {
        closeComments();
        return;
      }
      if (commentsInputEl.value !== replyText) commentsInputEl.value = replyText;
      commentsSendEl.classList.toggle("active", Boolean(replyText.trim()));
      replyBarEl.classList.remove("hidden");
    }

    function updateEditSheet() {
      if (!editingMessageId) {
        editOverlayEl.classList.remove("show");
        editInputEl.value = "";
        return;
      }
      const message = messages.find(item => item.id === editingMessageId);
      if (!message) return;
      editInputEl.value = message.content;
      editOverlayEl.classList.add("show");
    }

    function openConfirm(title, text, onConfirm) {
      confirmState = onConfirm;
      confirmTitleEl.textContent = title;
      confirmTextEl.textContent = text;
      confirmOverlayEl.classList.add("show");
    }

    function closeConfirm() {
      confirmState = null;
      confirmOverlayEl.classList.remove("show");
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sendActiveComment() {
      if (!activeCommentsMessageId || !replyText.trim()) return;
      const message = messages.find(item => item.id === activeCommentsMessageId);
      if (!message) return;
      message.replies.push({
        id: `reply-${crypto.randomUUID()}`,
        messageId: message.id,
        authorId: currentUserId,
        authorName: currentUserName,
        content: replyText.trim(),
        createdAt: Date.now(),
        isRead: true,
        readAt: Date.now()
      });
      replyText = "";
      activeCommentsMessageId = null;
      activeReplyMessageId = null;
      persistMessages();
      render();
    }

    document.querySelector(".icon-circle.back")?.addEventListener("click", () => {
      openMainTab("./homepage_preview.html");
    });

    document.getElementById("openEditorBtn").addEventListener("click", () => {
      openMessageEditor();
    });

    document.getElementById("emptyWriteBtn").addEventListener("click", () => {
      openMessageEditor();
    });

    feedEl.addEventListener("click", event => {
      if (suppressReplyClick) {
        suppressReplyClick = false;
        event.preventDefault();
        return;
      }
      const target = event.target.closest("[data-like],[data-open-comments],[data-toggle-replies],[data-open-viewer],[data-delete-message],[data-edit],[data-more]");
      if (!target) {
        const card = event.target.closest(".message-card");
        if (card) markMessageRead(card.dataset.messageId);
        return;
      }

      if (target.dataset.like) {
        const id = target.dataset.like;
        if (likedMessageIds.has(id)) {
          likedMessageIds.delete(id);
        } else {
          likedMessageIds.add(id);
          poppingLikeId = id;
          window.setTimeout(() => {
            if (poppingLikeId === id) {
              poppingLikeId = null;
              render();
            }
          }, 460);
        }
        localStorage.setItem(LIKED_STORAGE_KEY, JSON.stringify([...likedMessageIds]));
        markMessageRead(id);
        render();
        return;
      }

      if (target.dataset.toggleReplies) {
        const id = target.dataset.toggleReplies;
        if (expandedReplyIds.has(id)) {
          expandedReplyIds.delete(id);
        } else {
          expandedReplyIds.add(id);
        }
        markMessageRead(id);
        return;
      }

      if (target.dataset.openComments) {
        openComments(target.dataset.openComments);
        return;
      }

      if (target.dataset.openViewer) {
        openViewer(target.dataset.openViewer, Number(target.dataset.imageIndex || 0));
        return;
      }

      if (target.dataset.deleteMessage) {
        const messageId = target.dataset.deleteMessage;
        openConfirm("删除这条留言？", "删除后，这条留言和它的回复都会一起移除。", () => {
          messages = messages.filter(message => !(message.id === messageId && message.authorId === currentUserId));
          persistMessages();
          closeConfirm();
          render();
        });
        return;
      }

      if (target.dataset.edit) {
        editingMessageId = target.dataset.edit;
        updateEditSheet();
        return;
      }

      if (target.dataset.more) {
        document.querySelectorAll(".more-menu.show").forEach(menu => {
          if (menu.id !== `menu-${target.dataset.more}`) {
            menu.classList.remove("show");
          }
        });
        document.getElementById(`menu-${target.dataset.more}`)?.classList.toggle("show");
      }
    });

    feedEl.addEventListener("pointerdown", event => {
      const ownReply = event.target.closest("[data-own-reply]");
      if (!ownReply) return;
      window.clearTimeout(replyLongPressTimer);
      replyLongPressTimer = window.setTimeout(() => {
        suppressReplyClick = true;
        const replyId = ownReply.dataset.ownReply;
        openConfirm("删除这条评论？", "删除后无法恢复。", () => {
          messages.forEach(message => {
            message.replies = message.replies.filter(reply => !(reply.id === replyId && reply.authorId === currentUserId));
          });
          persistMessages();
          closeConfirm();
          render();
        });
      }, 560);
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
      feedEl.addEventListener(type, () => window.clearTimeout(replyLongPressTimer));
    });

    commentsInputEl.addEventListener("input", () => {
      replyText = commentsInputEl.value.slice(0, 300);
      commentsSendEl.classList.toggle("active", Boolean(replyText.trim()));
    });

    document.getElementById("commentsClose").addEventListener("click", closeComments);

    document.getElementById("viewerClose").addEventListener("click", () => {
      viewerState.open = false;
      updateViewer();
    });

    viewerStageEl.addEventListener("click", event => {
      if (event.target.closest(".viewer-nav.prev")) {
        viewerState.index -= 1;
        updateViewer();
      }
      if (event.target.closest(".viewer-nav.next")) {
        viewerState.index += 1;
        updateViewer();
      }
    });

    document.getElementById("editCancel").addEventListener("click", () => {
      editingMessageId = null;
      updateEditSheet();
    });

    document.getElementById("editSave").addEventListener("click", () => {
      const message = messages.find(item => item.id === editingMessageId);
      if (!message) return;
      const text = editInputEl.value.trim();
      if (!text) {
        alert("留言内容不能为空");
        return;
      }
      message.content = text.slice(0, 500);
      message.updatedAt = Date.now();
      persistMessages();
      editingMessageId = null;
      render();
    });

    document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
    document.getElementById("confirmOk").addEventListener("click", () => {
      if (confirmState) confirmState();
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".more-wrap")) {
        document.querySelectorAll(".more-menu.show").forEach(menu => menu.classList.remove("show"));
      }
    });

    const mainTabPageMap = {
      "./homepage_preview.html": "home",
      "./message_wall_preview.html": "messageWall",
      "./wish_list.html": "wishList",
      "./anniversary.html": "anniversary"
    };

    function openMainTab(route) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "secretbase-preview:navigate",
          page: mainTabPageMap[route] || null,
          route
        }, "*");
        return;
      }
      window.location.href = route;
    }

    function openMessageEditor() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "secretbase-preview:navigate",
          page: "messageEditor",
          route: "./message_wall_editor_preview.html"
        }, "*");
        return;
      }
      window.location.href = "./message_wall_editor_preview.html";
    }

    document.querySelectorAll("[data-main-tab]").forEach(node => {
      node.addEventListener("click", event => {
        event.preventDefault();
        openMainTab(node.dataset.mainTab);
      });
    });

    render();
  </script>
</body>
</html>
