<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>我们的秘密基地 - 首页</title>
  <link rel="stylesheet" href="./secretbase-preview.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap');

    :root {
      --page: #f3efee;
      --canvas: #fff8f5;
      --surface: #fff;
      --ink: #352a29;
      --muted: #806a66;
      --quiet: #9a7d78;
      --accent: #f48da1;
      --line: rgba(139, 104, 97, .12);
      --serif: "Noto Serif SC", "Songti SC", STSong, SimSun, serif;
      --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --soft-shadow: 0 10px 28px rgba(84, 54, 49, .09);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      justify-content: center;
      padding: 24px 12px;
      background:
        radial-gradient(circle at 22% 10%, rgba(250, 204, 198, .28), transparent 34%),
        var(--page);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    .phone {
      position: relative;
      width: min(100%, 430px);
      height: calc(100vh - 48px);
      min-height: 680px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 36px;
      background: var(--canvas);
      box-shadow: 0 24px 64px rgba(61, 39, 36, .14);
    }

    .scroll {
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      padding-bottom: 88px;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    .hero {
      position: relative;
      height: 616px;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-bg, .hero-wash {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hero-bg {
      z-index: -2;
      object-fit: cover;
      object-position: center bottom;
      transition: opacity .42s ease;
    }
    .hero-bg.is-changing { opacity: 0; }
    .hero-bg.is-lifted { transform: translateY(-28px) scale(1.12); }
    .hero-wash {
      z-index: -1;
      background: linear-gradient(
        180deg,
        rgba(255, 249, 245, .32) 0%,
        rgba(255, 249, 245, .07) 24%,
        transparent 58%,
        rgba(255, 248, 245, .36) 82%,
        var(--canvas) 100%
      );
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 8px 24px 0;
      color: #302624;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { width: 14px; height: 8px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; }
    .wifi { width: 12px; height: 8px; border: 2px solid currentColor; border-bottom: 0; border-radius: 12px 12px 0 0; }
    .battery { width: 18px; height: 9px; border: 1.8px solid currentColor; border-radius: 3px; background: linear-gradient(90deg, currentColor 76%, transparent 76%); }

    .carousel-dots { position: absolute; z-index: 1; top: 280px; left: 50%; display: flex; align-items: center; gap: 7px; transform: translateX(-50%); }
    .carousel-dots i { display: block; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .65); }
    .carousel-dots i.active { width: 9px; height: 9px; background: #fff; }

    .relationship-card {
      position: absolute;
      z-index: 1;
      top: 304px;
      right: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr) 66px;
      align-items: center;
      min-height: 148px;
      padding: 16px 22px;
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 30px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 8px 26px rgba(93, 62, 57, .07);
      text-align: center;
    }
    .couple-avatar { width: 66px; height: 66px; overflow: hidden; padding: 3px; border: 2px solid rgba(255, 255, 255, .94); border-radius: 50%; background: #fff7f4; }
    .couple-avatar img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .relationship-copy { min-width: 0; }
    .relationship-names { color: #4a3733; font-family: var(--serif); font-size: 18px; line-height: 24px; font-weight: 600; }
    .relationship-names .heart { padding: 0 7px; color: #fa8d9c; }
    .days { display: flex; align-items: flex-end; justify-content: center; gap: 5px; margin-top: 3px; line-height: 1; }
    .days-value { font-family: var(--serif); font-size: 54px; line-height: 60px; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .days-unit { padding-bottom: 8px; font-family: var(--serif); font-size: 17px; line-height: 20px; font-weight: 600; }
    .days-label { margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 18px; font-weight: 500; }

    .hero-detail-cards { position: absolute; z-index: 1; top: 466px; right: 20px; left: 20px; display: grid; gap: 10px; }
    .anniversary-card, .visit-card { display: flex; align-items: center; width: 100%; border: 1px solid rgba(255, 255, 255, .72); color: inherit; }
    .anniversary-card { min-height: 76px; gap: 12px; padding: 12px 16px; border-radius: 24px; background: rgba(255, 255, 255, .88); box-shadow: 0 5px 18px rgba(84, 54, 49, .06); text-align: left; cursor: pointer; }
    .detail-icon { display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border-radius: 14px; background: #fff3f2; }
    .detail-icon img { width: 24px; height: 24px; object-fit: contain; }
    .detail-copy { min-width: 0; flex: 1; }
    .detail-eyebrow { display: block; color: var(--muted); font-size: 12px; line-height: 17px; font-weight: 500; }
    .detail-title { display: block; overflow: hidden; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 23px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .anniversary-remain { flex: 0 0 auto; color: #4d3b37; font-family: var(--serif); font-size: 15px; line-height: 22px; font-weight: 600; }
    .anniversary-remain strong { color: #cd7880; font-size: 31px; font-weight: 700; }
    .detail-arrow { margin-left: 5px; color: var(--quiet); font-family: var(--serif); font-size: 24px; line-height: 1; }
    .visit-card { min-height: 54px; gap: 10px; padding: 8px 14px; border-radius: 22px; background: rgba(255, 255, 255, .74); }
    .visit-icon { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border-radius: 50%; background: #f8f2f1; color: #a78f8b; font-size: 20px; }
    .visit-copy { min-width: 82px; flex: 1; }
    .visit-title { display: block; font-family: var(--serif); font-size: 15px; line-height: 19px; font-weight: 600; }
    .visit-subtitle { display: block; color: var(--quiet); font-size: 11px; line-height: 15px; font-weight: 500; white-space: nowrap; }
    .visit-stamps { display: flex; gap: 5px; }
    .visit-stamp { min-width: 39px; padding: 5px 4px; border-radius: 10px; background: rgba(255, 255, 255, .7); color: #796562; font-size: 10px; line-height: 13px; font-weight: 500; text-align: center; white-space: pre-line; }

    .recent { padding: 18px 20px 26px; background: var(--canvas); }
    .activity-card { overflow: hidden; border: 1px solid rgba(255, 255, 255, .8); border-radius: 24px; background: rgba(255, 255, 255, .88); box-shadow: var(--soft-shadow); }
    .section-header { display: flex; align-items: center; gap: 9px; padding: 14px 16px 8px; }
    .section-icon { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border-radius: 11px; background: #fff0f1; }
    .section-icon img { width: 21px; height: 21px; object-fit: contain; }
    .section-header h2 { flex: 1; margin: 0; font-family: var(--serif); font-size: 19px; line-height: 26px; font-weight: 600; }
    .view-all { border: 0; padding: 7px 0 7px 10px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; }
    .activity { position: relative; display: flex; align-items: center; gap: 11px; min-height: 66px; padding: 9px 16px; cursor: pointer; }
    .activity + .activity::before { content: ""; position: absolute; top: 0; right: 16px; left: 76px; height: 1px; background: var(--line); }
    .activity-icon { display: grid; width: 48px; height: 48px; flex: 0 0 48px; place-items: center; overflow: hidden; border-radius: 14px; background: #fff8f7; }
    .activity-icon img { width: 32px; height: 32px; object-fit: contain; }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-title { display: block; overflow: hidden; font-family: var(--serif); font-size: 15px; line-height: 20px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .activity-detail { display: block; overflow: hidden; margin-top: 1px; color: var(--quiet); font-size: 12px; line-height: 17px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .activity-time { align-self: flex-start; padding-top: 4px; color: var(--quiet); font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      border-radius: 26px 26px 0 0;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 -4px 14px rgba(58, 39, 46, .04);
    }
    .nav-item { padding: 4px; border-radius: 16px; color: #8f8991; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 16px; text-align: center; }
    .nav-item img { display: block; width: 36px; height: 36px; margin: 0 auto 2px; object-fit: contain; opacity: .5; }
    .nav-item.active img { opacity: 1; }
    .nav-item.active { color: var(--accent); font-weight: 800; }

    button:focus-visible, .activity:focus-visible, .nav-item:focus-visible { outline: 3px solid rgba(244, 141, 161, .38); outline-offset: 2px; }
    button:active, .activity:active, .nav-item:active { transform: scale(.99); }

    @media (max-width: 380px) {
      .hero { height: 600px; }
      .relationship-card, .hero-detail-cards { right: 16px; left: 16px; }
      .relationship-card { grid-template-columns: 58px minmax(0, 1fr) 58px; padding-right: 16px; padding-left: 16px; }
      .couple-avatar { width: 58px; height: 58px; }
      .days-value { font-size: 50px; }
      .recent { padding-right: 16px; padding-left: 16px; }
      .visit-copy { min-width: 74px; }
      .visit-stamps { gap: 3px; }
      .visit-stamp { min-width: 35px; font-size: 9px; }
    }
    @media (max-height: 740px) { .phone { min-height: 0; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="我们的秘密基地首页预览">
    <div class="scroll">
      <section class="hero">
        <img class="hero-bg" src="../app/src/main/res/drawable-nodpi/home_plan_b_living_room.png" alt="暖阳客厅里的小羊和小耶" />
        <div class="hero-wash" aria-hidden="true"></div>
        <div class="statusbar" aria-hidden="true"><span id="statusTime">9:41</span><span class="status-icons"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span></div>
        <div class="carousel-dots" id="carouselDots" aria-label="插画轮播"></div>
        <section class="relationship-card" aria-label="我们的陪伴天数">
          <span class="couple-avatar"><img src="../app/src/main/res/drawable-nodpi/avatar_sheep.png?v=20261003-avatar-v2" alt="小羊" /></span>
          <div class="relationship-copy">
            <div class="relationship-names">小羊<span class="heart">♥</span>小耶</div>
            <div class="days"><span class="days-value" id="daysTogether">126</span><span class="days-unit">天</span></div>
            <div class="days-label">我们在一起已经</div>
          </div>
          <span class="couple-avatar"><img src="../app/src/main/res/drawable-nodpi/avatar_chick.png?v=20261003-avatar-v2" alt="小耶" /></span>
        </section>
        <div class="hero-detail-cards">
          <button class="anniversary-card" type="button" data-route="./anniversary.html">
            <span class="detail-icon"><img src="../app/src/main/res/drawable-nodpi/ic_anniversary_card.png?v=20261003-icon-redraw-2" alt="" /></span>
            <span class="detail-copy"><span class="detail-eyebrow">下一个纪念日</span><span class="detail-title" id="anniversaryTitle">恋爱一周年</span></span>
            <span class="anniversary-remain">还有 <strong id="anniversaryDays">240</strong> 天</span><span class="detail-arrow">›</span>
          </button>
          <section class="visit-card" aria-label="来过记录视觉占位">
            <span class="visit-icon" aria-hidden="true">✦</span>
            <span class="visit-copy"><span class="visit-title">来过记录</span><span class="visit-subtitle">Ta 最近来过 3 次</span></span>
            <span class="visit-stamps" aria-hidden="true"><span class="visit-stamp">9月1日
16:28</span><span class="visit-stamp">8月20日
21:14</span><span class="visit-stamp">8月12日
10:03</span></span>
          </section>
        </div>
      </section>

      <section class="recent">
        <div class="activity-card">
          <div class="section-header"><span class="section-icon"><img src="../app/src/main/res/drawable-nodpi/ic_message_wall_card.png?v=20261003-icon-redraw-2" alt="" /></span><h2>最近动态</h2><button class="view-all" type="button" data-route="./recent_activity_preview.html">查看更多&nbsp;›</button></div>
          <div class="activity" role="button" tabindex="0" data-route="./message_wall_preview.html">
            <span class="activity-icon"><img src="../app/src/main/res/drawable-nodpi/ic_activity_photo.png?v=20261003-icon-redraw-2" alt="" /></span>
            <span class="activity-copy"><span class="activity-title">小耶</span><span class="activity-detail">今晚一起看了电影，好开心！</span></span><span class="activity-time">9月1日 22:17</span>
          </div>
          <div class="activity" role="button" tabindex="0" data-route="./wish_list.html">
            <span class="activity-icon"><img src="../app/src/main/res/drawable-nodpi/ic_activity_checklist.png?v=20261003-icon-redraw-2" alt="" /></span>
            <span class="activity-copy"><span class="activity-title">一起看日落</span><span class="activity-detail">收藏了一张照片</span></span><span class="activity-time">8月28日 19:03</span>
          </div>
          <div class="activity" role="button" tabindex="0" data-route="./message_wall_preview.html">
            <span class="activity-icon"><img src="../app/src/main/res/drawable-nodpi/ic_message_wall_card.png?v=20261003-icon-redraw-2" alt="" /></span>
            <span class="activity-copy"><span class="activity-title">小羊</span><span class="activity-detail">想你了 ♡</span></span><span class="activity-time">8月20日 21:14</span>
          </div>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <div class="nav-item active" role="button" tabindex="0" data-route="./homepage_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_home_plan_b.png?v=20261003-icon-crop" alt="" />首页</div>
      <div class="nav-item" role="button" tabindex="0" data-route="./message_wall_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_message_wall_plan_b.png?v=20261003-icon-crop" alt="" />留言墙</div>
      <div class="nav-item" role="button" tabindex="0" data-route="./wish_list.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_wishlist_plan_b.png?v=20261003-icon-crop" alt="" />愿望清单</div>
      <div class="nav-item" role="button" tabindex="0" data-route="./anniversary.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_anniversary_plan_b.png?v=20261003-icon-crop" alt="" />纪念日</div>
    </nav>
  </main>

  <script>
    (() => {
      const START_DATE = new Date("2026-05-06T00:00:00");
      const heroImageEl = document.querySelector(".hero-bg");
      const carouselDotsEl = document.getElementById("carouselDots");
      const shuffle = values => {
        const copy = [...values];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      };
      const heroImages = shuffle([
        { src: "../app/src/main/res/drawable-nodpi/home_plan_b_living_room.png", alt: "暖阳客厅里的小羊和小耶" },
        { src: "../app/src/main/res/drawable-nodpi/home_carousel_autumn_bench.png", alt: "秋日长椅上的小羊和小耶", lifted: true },
        { src: "../app/src/main/res/drawable-nodpi/home_carousel_lakeside_picnic.png", alt: "湖边野餐的小羊和小耶", lifted: true },
        { src: "../app/src/main/res/drawable-nodpi/home_carousel_night_reading.png", alt: "夜晚一起读书的小羊和小耶" },
        { src: "../app/src/main/res/drawable-nodpi/home_carousel_game_night.png", alt: "一起打游戏的小羊和小耶" },
        { src: "../app/src/main/res/drawable-nodpi/home_carousel_stargazing.png", alt: "星空下相依的小羊和小耶", lifted: true }
      ]);
      let activeHeroIndex = 0;
      const routePageMap = {
        "./homepage_preview.html": "home",
        "./message_wall_preview.html": "messageWall",
        "./message_wall_editor_preview.html": "messageEditor",
        "./wish_list.html": "wishList",
        "./anniversary.html": "anniversary",
        "./recent_activity_preview.html": "recentActivity"
      };
      const startOfDay = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diffDays = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
      const pad = value => String(value).padStart(2, "0");
      const toChineseNumber = value => {
        const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
        if (value < 10) return digits[value];
        if (value < 20) return `十${value === 10 ? "" : digits[value % 10]}`;
        if (value < 100) return `${digits[Math.floor(value / 10)]}十${value % 10 === 0 ? "" : digits[value % 10]}`;
        return String(value);
      };

      function renderHeroCarousel(animate) {
        const image = heroImages[activeHeroIndex];
        carouselDotsEl.setAttribute("aria-label", `插画轮播，第 ${activeHeroIndex + 1} 张，共 ${heroImages.length} 张`);
        carouselDotsEl.innerHTML = heroImages.map((_, index) => `<i class="${index === activeHeroIndex ? "active" : ""}"></i>`).join("");
        if (!animate) {
          heroImageEl.src = image.src;
          heroImageEl.alt = image.alt;
          heroImageEl.classList.toggle("is-lifted", Boolean(image.lifted));
          return;
        }
        heroImageEl.classList.add("is-changing");
        window.setTimeout(() => {
          heroImageEl.src = image.src;
          heroImageEl.alt = image.alt;
          heroImageEl.classList.toggle("is-lifted", Boolean(image.lifted));
          heroImageEl.classList.remove("is-changing");
        }, 210);
      }

      function updateLiveContent() {
        const now = new Date();
        const today = startOfDay(now);
        document.getElementById("statusTime").textContent = `${now.getHours()}:${pad(now.getMinutes())}`;
        document.getElementById("daysTogether").textContent = Math.max(1, diffDays(today, START_DATE) + 1);
        const anniversaryThisYear = new Date(today.getFullYear(), 4, 6);
        const nextAnniversary = today < anniversaryThisYear ? anniversaryThisYear : new Date(today.getFullYear() + 1, 4, 6);
        const yearCount = Math.max(1, nextAnniversary.getFullYear() - START_DATE.getFullYear());
        const remain = diffDays(nextAnniversary, today);
        document.getElementById("anniversaryTitle").textContent = `恋爱${toChineseNumber(yearCount)}周年`;
        document.getElementById("anniversaryDays").textContent = remain === 0 ? "0" : remain;
      }

      function navigate(route) {
        const page = routePageMap[route] || "home";
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "secretbase-preview:navigate", page, route }, "*");
        } else {
          window.location.href = route;
        }
      }

      document.querySelectorAll("[data-route]").forEach(node => {
        node.addEventListener("click", event => { event.preventDefault(); navigate(node.dataset.route); });
        node.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); navigate(node.dataset.route); }
        });
      });
      heroImages.forEach(image => { new Image().src = image.src; });
      renderHeroCarousel(false);
      window.setInterval(() => {
        activeHeroIndex = (activeHeroIndex + 1) % heroImages.length;
        renderHeroCarousel(true);
      }, 3500);
      updateLiveContent();
      setInterval(updateLiveContent, 30000);
    })();
  </script>
</body>
</html>
