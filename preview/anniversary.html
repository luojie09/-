<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>纪念日预览</title>
  <link rel="stylesheet" href="./secretbase-preview.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

    :root{
      --bg:#fdeef3;
      --bg-top:#fffefe;
      --surface:rgba(255,255,255,.92);
      --line:#f2e7eb;
      --ink:#202128;
      --muted:#8b8792;
      --pink:#ff6f95;
      --pink-strong:#ff5a8b;
      --pink-soft:#fff0f4;
      --blue:#f3f8fd;
      --gold:#fff6e4;
      --mint:#eff9f3;
      --gray:#f5f4f6;
      --shadow:0 10px 28px rgba(89,61,72,.07);
      --font-body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      --font-heading:"Playfair Display","Noto Serif SC","PingFang SC","Microsoft YaHei",serif;
      --font-number:var(--font-body);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:#fff;
      color:var(--ink);
      font-family:var(--font-body);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      font-kerning:normal;
    }
    body{min-height:100vh;padding:24px 12px;display:flex;justify-content:center}

    .phone{
      width:min(100%,430px);
      min-height:calc(100vh - 48px);
      background:#fff;
      border-radius:38px;
      border:1px solid rgba(255,255,255,.84);
      box-shadow:0 20px 56px rgba(49,34,41,.12);
      overflow:hidden;
      position:relative;
    }

    .screen{
      min-height:100%;
      padding:calc(14px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
      overflow:auto;
      background:#fff;
    }

    .topbar{
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      margin-bottom:14px;
    }

    .topbar.no-back{
      grid-template-columns:1fr 44px;
    }

    .title{
      margin:0;
      text-align:center;
      font-size:21px;
      font-family:var(--font-heading);
      font-weight:700;
      letter-spacing:0;
    }

    .topbar.no-back .title{
      text-align:left;
    }

    .circle-btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      background:transparent;
      box-shadow:none;
      display:grid;
      place-items:center;
      color:var(--ink);
      cursor:pointer;
    }

    .circle-btn svg{width:21px;height:21px}
    .circle-btn.add{color:var(--pink)}

    .hero,
    .card,
    .empty-card{
      background:var(--surface);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    .hero{
      position:relative;
      display:block;
      height:192px;
      border:0;
      border-radius:0;
      padding:0;
      margin-bottom:2px;
      background:transparent;
      box-shadow:none;
      overflow:hidden;
    }

    .hero-art{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      transform:scale(1.12);
      transform-origin:center;
      pointer-events:none;
    }

    .hero-copy{
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      min-width:0;
      padding:8px 100px;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      pointer-events:none;
    }

    .hero-ill{
      grid-column:2;
      grid-row:1 / span 3;
      width:108px;
      height:92px;
      border-radius:0;
      overflow:visible;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 0 0 auto;
    }

    .hero-ill img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .hero-label{
      margin:0;
      color:var(--muted);
      font-size:13px;
      font-weight:600;
      letter-spacing:.01em;
    }

    .hero-days{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:4px;
      margin:2px 0 3px;
    }

    .hero-days strong{
      font-size:52px;
      line-height:1;
      font-family:var(--font-number);
      font-weight:700;
      color:#64a1e3;
      letter-spacing:-.025em;
      font-variant-numeric:tabular-nums;
    }

    @media (max-width:360px){
      .hero{
        height:168px;
      }

      .hero-copy{padding:6px 82px}

      .hero-days strong{
        font-size:38px;
      }
    }

    .hero-days span{
      padding-bottom:4px;
      font-size:18px;
      font-weight:700;
      color:var(--muted);
    }

    .hero-sub{
      margin:0;
      font-size:14px;
      color:var(--muted);
      line-height:1.6;
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }

    .legend{
      display:none;
      gap:8px;
      margin:0 0 16px;
      padding:14px 16px;
      border-radius:24px;
      border:1px solid rgba(246,220,229,.92);
      background:rgba(255,255,255,.72);
    }

    .legend-item{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .legend-dot{
      width:12px;
      height:12px;
      border-radius:50%;
      flex:none;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:0;
    }

    .card{
      display:flex;
      align-items:flex-start;
      gap:12px;
      border:0;
      border-bottom:1px solid #e7e2e4;
      border-radius:0;
      padding:15px 0;
      background:transparent;
      box-shadow:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
    }

    .card:last-child{border-bottom:0}

    .card-head{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width:0;
      flex:1;
      padding:0;
      border:0;
      background:transparent;
      color:inherit;
      font:inherit;
      text-align:left;
      cursor:pointer;
    }

    .icon-box{
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:20px;
      flex:none;
      border:none;
    }

    .icon-box svg{
      width:20px;
      height:20px;
      display:block;
    }

    .icon-box.today,
    .icon-box.upcoming{background:rgba(255,111,149,.14);color:#df7893}
    .icon-box.past{background:rgba(77,182,172,.14);color:#4b978e}
    .icon-box.expired{background:rgba(176,190,197,.14);color:#8d99a1}

    .card-main{min-width:0;flex:1}
    .card-title-row{
      display:flex;
      align-items:flex-start;
      gap:8px;
    }

    .card-title{
      margin:0;
      font-size:17px;
      font-family:var(--font-body);
      font-weight:700;
      line-height:1.35;
      flex:1;
      letter-spacing:-.008em;
    }

    .card-date{
      color:var(--muted);
      font-size:13px;
      font-weight:500;
      margin:4px 0 0;
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }

    .meta-row,
    .chip-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      font-size:12px;
      margin-top:10px;
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }

    .status-badge,
    .meta-copy,
    .pill{
      display:inline-flex;
      align-items:center;
      min-height:28px;
    }

    .status-badge{
      border-radius:999px;
      padding:0 10px;
      font-weight:700;
    }

    .status-badge.today{background:var(--pink-soft);color:var(--pink-strong)}
    .status-badge.upcoming{background:var(--gold);color:#a87711}
    .status-badge.past{background:var(--mint);color:#40856e}
    .status-badge.expired{background:var(--gray);color:#767682}

    .meta-copy{
      color:var(--muted);
      font-weight:640;
    }

    .pill{
      border-radius:999px;
      padding:4px 10px;
      font-weight:700;
    }

    .pill.today{background:rgba(255,111,149,.1);color:var(--pink)}
    .pill.upcoming{background:rgba(255,111,149,.12);color:var(--pink)}
    .pill.past{background:rgba(77,182,172,.1);color:#4db6ac}
    .pill.expired{background:rgba(139,135,146,.1);color:var(--muted)}
    .pill.repeat{
      width:max-content;
      margin-top:8px;
      background:#f9f4f6;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .meta-sep{
      width:3px;
      height:3px;
      border-radius:50%;
      background:#d4ced5;
      flex:none;
    }

    .text-icon{
      border:none;
      background:none;
      color:var(--muted);
      font-size:18px;
      line-height:1;
      cursor:pointer;
      padding:2px 0 0;
      flex:none;
    }

    .menu-wrap{position:relative;margin-left:auto}
    .menu{
      position:absolute;
      right:0;
      top:28px;
      width:118px;
      border-radius:16px;
      border:1px solid rgba(242,231,235,.94);
      background:#fff;
      box-shadow:0 14px 28px rgba(52,30,39,.1);
      padding:8px;
      display:none;
      z-index:10;
    }

    .menu.show{display:block}
    .menu button{
      width:100%;
      border:none;
      background:none;
      text-align:left;
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      color:var(--ink);
      font:600 14px/1.2 inherit;
    }

    .menu button:hover{background:#fff4f8}
    .menu button.danger{color:var(--pink)}

    .card-side{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      flex:none;
    }

    .card-actions{
      display:flex;
      gap:2px;
      align-items:center;
      justify-content:flex-end;
    }

    .mini-action{
      width:36px;
      height:36px;
      border:none;
      border-radius:0;
      display:grid;
      place-items:center;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
    }

    .mini-action svg{
      width:17px;
      height:17px;
    }

    .mini-action.danger{color:var(--pink)}

    .card-meta{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
      font-weight:500;
      font-family:var(--font-number);
      font-variant-numeric:tabular-nums;
    }

    .status-text{
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }

    .status-text.today,
    .status-text.upcoming{color:var(--pink)}
    .status-text.past{color:#4d9d88}
    .status-text.expired{color:var(--muted)}

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 0 6px;
    }

    .section-head strong{font-size:17px;font-weight:700}
    .section-head span{font-size:12px;color:var(--muted)}

    body.theme-secondary .hero,
    body.theme-secondary .card{
      border:0 !important;
      border-radius:0 !important;
      background:transparent !important;
      box-shadow:none !important;
    }

    body.theme-secondary .card{
      border-bottom:1px solid #e7e2e4 !important;
    }

    body.theme-secondary .card:last-child{
      border-bottom:0 !important;
    }

    .empty-card{
      border-radius:24px;
      padding:22px 18px;
      text-align:center;
    }

    .empty-card .hero-ill{
      width:100%;
      height:132px;
      margin:0 auto 12px;
    }

    .empty-card h3{
      margin:10px 0 6px;
      font-size:22px;
      font-family:var(--font-heading);
      font-weight:700;
      letter-spacing:-.01em;
    }
    .empty-card p{margin:0 0 16px;color:var(--muted);line-height:1.7}

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(21,18,24,.62);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:20px 10px;
      z-index:99;
    }

    .overlay.show{display:flex}

    .sheet{
      width:min(100%,430px);
      border-radius:30px 30px 0 0;
      background:#fff;
      box-shadow:0 30px 72px rgba(33,20,28,.3);
      padding:18px 18px calc(20px + env(safe-area-inset-bottom));
      max-height:88vh;
      overflow:auto;
    }

    .sheet h3{
      margin:0 0 16px;
      font-size:22px;
      font-family:var(--font-heading);
      font-weight:700;
      letter-spacing:-.01em;
    }

    .field{margin-bottom:14px}
    .field-label{margin-bottom:8px;font-size:14px;font-weight:800}

    input[type="text"],
    input[type="date"]{
      width:100%;
      border:none;
      outline:none;
      border-radius:22px;
      background:#fffafc;
      border:1px solid rgba(245,220,229,.95);
      padding:14px 16px;
      font:600 15px/1.6 var(--font-body);
      color:var(--ink);
      font-variant-numeric:tabular-nums;
    }

    .switch-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:4px 0 6px;
    }

    .switch-note{
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
      margin-top:4px;
    }

    .toggle{
      width:54px;
      height:32px;
      border:none;
      border-radius:999px;
      background:#f1d7df;
      position:relative;
      cursor:pointer;
      transition:.2s;
    }

    .toggle::after{
      content:"";
      position:absolute;
      top:4px;
      left:4px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 4px 10px rgba(32,20,26,.14);
      transition:.2s;
    }

    .toggle.active{
      background:linear-gradient(135deg,#ff89aa,#ff5c89);
    }

    .toggle.active::after{
      transform:translateX(22px);
    }

    .reminders{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .emoji-picker{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:8px;
    }

    .emoji-option{
      height:44px;
      border-radius:14px;
      border:1px solid rgba(242,231,235,.92);
      background:#fffbfd;
      display:grid;
      place-items:center;
      color:#67707a;
      cursor:pointer;
      transition:background .18s ease,border-color .18s ease,transform .18s ease;
    }

    .emoji-option svg{width:21px;height:21px;display:block}

    .emoji-option.active{
      background:#fff0f4;
      border-color:rgba(255,111,149,.36);
      color:#df7893;
      transform:translateY(-1px);
    }

    .reminder{
      border:none;
      border-radius:999px;
      padding:11px 14px;
      background:#fff;
      border:1px solid rgba(245,220,229,.92);
      color:var(--muted);
      font-weight:700;
      cursor:pointer;
    }

    .reminder.active{
      background:linear-gradient(135deg,#ff89aa,#ff5c89);
      border-color:transparent;
      color:#fff;
      box-shadow:0 12px 22px rgba(255,111,149,.22);
    }

    .primary-btn,
    .secondary-btn{
      border:none;
      border-radius:999px;
      cursor:pointer;
      font-weight:800;
      font-family:inherit;
      padding:14px 24px;
      font-size:16px;
    }

    .primary-btn{
      background:linear-gradient(135deg,#ff89aa,#ff5c89);
      color:#fff;
      box-shadow:0 14px 24px rgba(255,111,149,.24);
    }

    .secondary-btn{
      background:#fff;
      border:1px solid rgba(245,220,229,.95);
      color:var(--ink);
    }

    .sheet-actions{
      display:flex;
      justify-content:flex-end;
      gap:12px;
      margin-top:18px;
    }

    .confirm{
      width:min(100%,380px);
      border-radius:28px;
      background:#fff;
      box-shadow:0 30px 80px rgba(33,20,28,.3);
      padding:22px 20px;
      margin:auto;
    }

    .confirm h3{margin:0 0 10px;font-size:22px}
    .confirm p{margin:0;color:var(--muted);line-height:1.7}
    .confirm .sheet-actions{margin-top:18px}

    .main-tab-nav{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      padding:6px 10px calc(6px + env(safe-area-inset-bottom));
      border-radius:26px 26px 0 0;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.96);
      box-shadow:0 -4px 14px rgba(58,39,46,.04);
      z-index:20;
    }

    .main-tab-item{
      border:0;
      background:transparent;
      color:var(--muted);
      font:700 12px/16px var(--font-body);
      padding:4px;
      cursor:pointer;
    }

    .main-tab-item.active{
      color:var(--pink);
      font-weight:800;
    }

    .main-tab-item img{ opacity:.5; }
    .main-tab-item.active img{ opacity:1; }

    .main-tab-item img{
      display:block;
      width:32px;
      height:32px;
      margin:0 auto 2px;
      object-fit:contain;
    }
  </style>
</head>
<body class="theme-secondary">
  <div class="phone">
    <div class="screen" id="screen"></div>
    <nav class="main-tab-nav">
      <button class="main-tab-item" type="button" data-main-tab="./homepage_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_home_plan_b.png?v=20261003-icon-crop" alt="">首页</button>
      <button class="main-tab-item" type="button" data-main-tab="./message_wall_preview.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_message_wall_plan_b.png?v=20261003-icon-crop" alt="">留言墙</button>
      <button class="main-tab-item" type="button" data-main-tab="./wish_list.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_wishlist_plan_b.png?v=20261003-icon-crop" alt="">愿望清单</button>
      <button class="main-tab-item active" type="button" data-main-tab="./anniversary.html"><img src="../app/src/main/res/drawable-nodpi/ic_nav_anniversary_plan_b.png?v=20261003-icon-crop" alt="">纪念日</button>
    </nav>
  </div>

  <div class="overlay" id="editorOverlay">
    <div class="sheet">
      <h3 id="editorTitle"></h3>
      <div class="field">
        <div class="field-label">纪念日名称 *</div>
        <input id="nameInput" type="text" maxlength="50" placeholder="请输入纪念日名称" />
      </div>
      <div class="field">
        <div class="field-label">图标</div>
        <div class="emoji-picker" id="iconPicker"></div>
      </div>
      <div class="field">
        <div class="field-label">日期 *</div>
        <input id="dateInput" type="date" />
      </div>
      <div class="field">
        <div class="switch-row">
          <div>
            <div class="field-label" style="margin:0">每年重复</div>
            <div class="switch-note">生日、相识纪念日这类更适合打开重复。</div>
          </div>
          <button class="toggle" id="repeatToggle" type="button" aria-label="每年重复"></button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">提醒时间</div>
        <div class="reminders" id="reminderRow"></div>
      </div>
      <div class="sheet-actions">
        <button class="secondary-btn" id="editorCancel" type="button">取消</button>
        <button class="primary-btn" id="editorSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="confirmOverlay">
    <div class="confirm">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="sheet-actions">
        <button class="secondary-btn" id="confirmCancel" type="button">取消</button>
        <button class="primary-btn" id="confirmOk" type="button">删除</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "secretbase-preview-anniversaries-v1";
    const screenEl = document.getElementById("screen");
    const overlayEl = document.getElementById("editorOverlay");
    const confirmOverlayEl = document.getElementById("confirmOverlay");
    const heroImage = "../app/src/main/res/drawable-nodpi/home_couple_hero.webp?v=20260710-new-hero";
    const anniversaryPeopleImage = "../app/src/main/res/drawable-nodpi/anniversary_header_dynamic_note.png";
    const relationshipStart = "2026-05-06";
    const today = toDateString(Date.now());

    const reminderOptions = [
      { value: "NONE", label: "不提醒" },
      { value: "SAME_DAY", label: "当天提醒" },
      { value: "ONE_DAY_BEFORE", label: "提前1天" },
      { value: "THREE_DAYS_BEFORE", label: "提前3天" }
    ];

    const iconMap = {
      "在一起的日子": "together",
      "第一次约会": "date",
      "第一次旅行": "trip",
      "第一次见家长": "home",
      "生日 - 小羊": "birthday",
      "生日 - 小耶": "gift"
    };

    const iconOptions = ["together","date","trip","birthday","gift","home","photo","movie","dinner","music","flower","star"];
    const iconLabels = {
      together: "相伴", date: "约会", trip: "旅行", birthday: "生日", gift: "礼物", home: "回家",
      photo: "拍照", movie: "电影", dinner: "晚餐", music: "音乐", flower: "花", star: "星标"
    };
    const legacyIconAliases = {
      "💗":"together", "🌸":"date", "🎂":"birthday", "🎁":"gift", "✈️":"trip", "🌊":"trip",
      "⭐":"star", "🍀":"flower", "🏠":"home", "📷":"photo", "🍰":"birthday", "🎬":"movie",
      "🌙":"star", "☀️":"star", "💌":"together", "🦋":"flower", "🐑":"together", "🐥":"together"
    };

    const appState = {
      editorOpen: false,
      editingId: null,
      name: "",
      date: today,
      iconEmoji: "together",
      repeatYearly: true,
      reminderType: "NONE",
      menuId: null
    };

    let anniversaries = loadItems();
    let confirmHandler = null;

    function seedItems() {
      return [
        { id: "anniversary-love", title: "在一起的日子", date: "2026-05-06", repeatYearly: false, reminderType: "NONE", createdAt: "2026-05-06", iconEmoji: "together" },
        { id: "anniversary-first-date", title: "第一次约会", date: "2026-06-15", repeatYearly: true, reminderType: "SAME_DAY", createdAt: "2026-05-20", iconEmoji: "date" },
        { id: "anniversary-first-trip", title: "第一次旅行", date: "2026-10-01", repeatYearly: true, reminderType: "ONE_DAY_BEFORE", createdAt: "2026-05-23", iconEmoji: "trip" },
        { id: "anniversary-first-growth", title: "第一次见家长", date: "2026-10-20", repeatYearly: false, reminderType: "THREE_DAYS_BEFORE", createdAt: "2026-05-26", iconEmoji: "home" },
        { id: "anniversary-sheep-birthday", title: "生日 - 小羊", date: "2026-08-15", repeatYearly: true, reminderType: "ONE_DAY_BEFORE", createdAt: "2026-05-28", iconEmoji: "birthday" },
        { id: "anniversary-chick-birthday", title: "生日 - 小耶", date: "2026-11-02", repeatYearly: true, reminderType: "THREE_DAYS_BEFORE", createdAt: "2026-05-28", iconEmoji: "gift" }
      ];
    }

    function loadItems() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const seed = seedItems();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
        return seed;
      }
      try {
        return JSON.parse(raw);
      } catch (error) {
        const seed = seedItems();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
        return seed;
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(anniversaries));
    }

    function toDateString(timestamp) {
      const date = new Date(timestamp);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function formatDate(value) {
      return value.replaceAll("-", ".");
    }

    function dateDiffInDays(from, to) {
      const start = new Date(`${from}T00:00:00+08:00`).getTime();
      const end = new Date(`${to}T00:00:00+08:00`).getTime();
      return Math.round((end - start) / 86400000);
    }

    function relationshipDays() {
      return Math.max(1, dateDiffInDays(relationshipStart, today) + 1);
    }

    function normalizedDate(item) {
      if (!item.repeatYearly) return item.date;
      const [, month, day] = item.date.split("-");
      const thisYear = `${today.slice(0, 4)}-${month}-${day}`;
      return thisYear < today ? `${Number(today.slice(0, 4)) + 1}-${month}-${day}` : thisYear;
    }

    function itemStatus(item) {
      const effectiveDate = normalizedDate(item);
      const diff = dateDiffInDays(today, effectiveDate);
      if (diff === 0) {
        return { text: "就是今天", tone: "today", sortBucket: 0, distance: 0 };
      }
      if (diff > 0) {
        return { text: `还有 ${diff} 天`, tone: "upcoming", sortBucket: 1, distance: diff };
      }
      if (item.repeatYearly) {
        return { text: `已过去 ${Math.abs(diff)} 天`, tone: "past", sortBucket: 2, distance: Math.abs(diff) };
      }
      return { text: "已过期（不重复）", tone: "expired", sortBucket: 3, distance: 9999 };
    }

    function sortedItems() {
      return [...anniversaries]
        .map(item => ({ ...item, meta: itemStatus(item) }))
        .sort((a, b) => {
          if (a.meta.sortBucket !== b.meta.sortBucket) return a.meta.sortBucket - b.meta.sortBucket;
          return a.meta.distance - b.meta.distance;
        });
    }

    function defaultIconForTitle(title) {
      if (title.includes("生日")) return "birthday";
      if (title.includes("旅行") || title.includes("海")) return "trip";
      if (title.includes("约会")) return "date";
      if (title.includes("见家长") || title.includes("回家")) return "home";
      if (title.includes("照片") || title.includes("相册")) return "photo";
      if (title.includes("电影")) return "movie";
      if (title.includes("吃") || title.includes("餐")) return "dinner";
      if (title.includes("音乐") || title.includes("演唱会")) return "music";
      return iconMap[title] || "together";
    }

    function normalizeSceneIcon(icon) {
      return legacyIconAliases[icon] || (iconOptions.includes(icon) ? icon : "together");
    }

    function sceneIconSvg(icon) {
      const key = normalizeSceneIcon(icon);
      const paths = {
        together: '<path d="M20.8 4.6c-1.7-1.6-4.4-1.4-5.9.4L12 8.1 9.1 5C7.6 3.2 4.9 3 3.2 4.6c-1.9 1.8-2 4.9-.2 6.8L12 20l9-8.6c1.8-1.9 1.7-5-.2-6.8Z"/>',
        date: '<path d="M4 8h13a3 3 0 0 1 3 3v2a5 5 0 0 1-5 5H8a4 4 0 0 1-4-4V8Z"/><path d="M4 11H2"/><path d="M8 4v4"/><path d="M12 4v4"/>',
        trip: '<path d="M3 13.5 21 4l-6.5 16-3.1-6.4L3 13.5Z"/><path d="m11.4 13.6 3.4-3.4"/>',
        birthday: '<path d="M5 11h14v9H5z"/><path d="M4 15h16"/><path d="M8 11c-1.6-1.4.6-3.8 2-2.1 1.4-1.7 3.6.7 2 2.1"/><path d="M12 8V4"/><path d="M10.6 5.5 12 4l1.4 1.5"/>',
        gift: '<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M3 8h18v4H3zM12 8v12"/><path d="M12 8H8.7A2.1 2.1 0 1 1 12 5.5V8ZM12 8h3.3A2.1 2.1 0 1 0 12 5.5V8Z"/>',
        home: '<path d="m3 11 9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>',
        photo: '<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3"/><path d="M8 6l1-2h6l1 2"/>',
        movie: '<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M7 6l3 4m2-4 3 4m2-4 3 4"/>',
        dinner: '<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3v18M17 3c2.2 1.1 3 3.5 2 6h-2"/>',
        music: '<path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',
        flower: '<path d="M12 21V11"/><path d="M12 11c-4.5 0-6-5.5-2.5-7.3C10.7 3 12 4.2 12 5.6 12 4.2 13.3 3 14.5 3.7 18 5.5 16.5 11 12 11Z"/><path d="M12 16c-2.5-2.1-5.3-1.6-6.5.7 2.7.7 4.8.4 6.5-.7Z"/>',
        star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2-4.5-4.4 6.2-.9L12 3Z"/>'
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[key]}</svg>`;
    }

    function legend() {
      return `
        <section class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:#ff8ead"></span>就是今天</div>
          <div class="legend-item"><span class="legend-dot" style="background:#ffc45c"></span>还有 x 天</div>
          <div class="legend-item"><span class="legend-dot" style="background:#7bd0b2"></span>已经过去 x 天</div>
          <div class="legend-item"><span class="legend-dot" style="background:#c8c6cc"></span>已过期（不重复）</div>
        </section>
      `;
    }

    function renderCard(item) {
      const meta = item.meta;
      return `
        <article class="card" data-id="${item.id}">
          <button class="card-head" type="button" data-action="edit" data-id="${item.id}" aria-label="编辑 ${escapeHtml(item.title)}">
            <div class="icon-box ${meta.tone}">${sceneIconSvg(item.iconEmoji || defaultIconForTitle(item.title))}</div>
            <div class="card-main">
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-meta">
                <span>${formatDate(item.date)}</span>
                <span>·</span>
                <span>${item.repeatYearly ? "每年重复" : "不重复"}</span>
              </div>
            </div>
          </button>
          <div class="card-side">
            <span class="status-text ${meta.tone}">${meta.text}</span>
          </div>
        </article>
      `;
    }

    function render() {
      const items = sortedItems();
      screenEl.innerHTML = `
        <div class="topbar no-back">
          <h1 class="title">纪念日</h1>
          <button class="circle-btn add" type="button" data-action="open-editor" aria-label="新增">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5V19"/><path d="M5 12H19"/></svg>
          </button>
        </div>

        <section class="hero">
          <img class="hero-art" src="${anniversaryPeopleImage}" alt="">
          <div class="hero-copy">
            <p class="hero-label">我们在一起已经</p>
            <div class="hero-days"><strong>${relationshipDays()}</strong><span>天</span></div>
            <p class="hero-sub">${formatDate(relationshipStart)}</p>
          </div>
        </section>

        ${legend()}

        ${items.length ? `
          <div class="section-head"><strong>重要日子</strong><span>${items.length} 个 · 长按删除</span></div>
          <section class="list">${items.map(renderCard).join("")}</section>
        ` : `
          <section class="empty-card">
            <div class="hero-ill"><img src="${heroImage}" alt="插画"></div>
            <h3>还没有纪念日</h3>
            <p>把值得记住的日子都放进来，以后就不会错过了。</p>
            <button class="primary-btn" type="button" data-action="open-editor">新增纪念日</button>
          </section>
        `}
      `;
    }

    function openEditor(item) {
      appState.editorOpen = true;
      appState.editingId = item ? item.id : null;
      appState.name = item ? item.title : "";
      appState.date = item ? item.date : today;
      appState.iconEmoji = item ? normalizeSceneIcon(item.iconEmoji || defaultIconForTitle(item.title)) : "together";
      appState.repeatYearly = item ? item.repeatYearly : true;
      appState.reminderType = item ? item.reminderType : "NONE";
      document.getElementById("editorTitle").textContent = item ? "编辑纪念日" : "新增纪念日";
      document.getElementById("nameInput").value = appState.name;
      document.getElementById("dateInput").value = appState.date;
      renderIconPicker();
      renderReminderRow();
      syncToggle();
      overlayEl.classList.add("show");
    }

    function closeEditor() {
      appState.editorOpen = false;
      overlayEl.classList.remove("show");
    }

    function syncToggle() {
      document.getElementById("repeatToggle").classList.toggle("active", appState.repeatYearly);
    }

    function renderIconPicker() {
      document.getElementById("iconPicker").innerHTML = iconOptions.map(icon => `
        <button class="emoji-option ${appState.iconEmoji === icon ? "active" : ""}" type="button" data-action="pick-icon" data-value="${icon}" aria-label="选择${iconLabels[icon]}">${sceneIconSvg(icon)}</button>
      `).join("");
    }

    function renderReminderRow() {
      document.getElementById("reminderRow").innerHTML = reminderOptions.map(option => `
        <button class="reminder ${appState.reminderType === option.value ? "active" : ""}" type="button" data-action="pick-reminder" data-value="${option.value}">${option.label}</button>
      `).join("");
    }

    function saveEditor() {
      const title = document.getElementById("nameInput").value.trim();
      const date = document.getElementById("dateInput").value;
      if (!title) {
        alert("纪念日名称不能为空");
        return;
      }
      if (!date) {
        alert("请选择日期");
        return;
      }
      const payload = {
        id: appState.editingId || `anniversary-${crypto.randomUUID()}`,
        title,
        date,
        iconEmoji: normalizeSceneIcon(appState.iconEmoji || defaultIconForTitle(title)),
        repeatYearly: appState.repeatYearly,
        reminderType: appState.reminderType,
        createdAt: appState.editingId ? anniversaries.find(item => item.id === appState.editingId)?.createdAt || today : today
      };
      if (appState.editingId) {
        anniversaries = anniversaries.map(item => item.id === payload.id ? payload : item);
      } else {
        anniversaries.push(payload);
      }
      persist();
      closeEditor();
      render();
    }

    function openConfirm(title, text, handler) {
      confirmHandler = handler;
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmText").textContent = text;
      confirmOverlayEl.classList.add("show");
    }

    function closeConfirm() {
      confirmHandler = null;
      confirmOverlayEl.classList.remove("show");
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const longPressDuration = 650;
    let longPressTimer = null;
    let suppressedEditId = null;

    function cancelLongPress() {
      if (longPressTimer !== null) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    screenEl.addEventListener("pointerdown", event => {
      const card = event.target.closest(".card[data-id]");
      if (!card || event.pointerType === "mouse" && event.button !== 0) return;
      const id = card.dataset.id;
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        suppressedEditId = id;
        openConfirm("删除这个纪念日？", "删除后不会再出现在列表中，后续可以重新新增。", () => {
          anniversaries = anniversaries.filter(item => item.id !== id);
          persist();
          closeConfirm();
          render();
        });
      }, longPressDuration);
    });

    screenEl.addEventListener("pointerup", () => {
      cancelLongPress();
      window.setTimeout(() => { suppressedEditId = null; }, 0);
    });
    screenEl.addEventListener("pointercancel", () => {
      cancelLongPress();
      suppressedEditId = null;
    });
    screenEl.addEventListener("pointerleave", cancelLongPress);

    screenEl.addEventListener("click", event => {
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) {
        if (!event.target.closest(".menu-wrap")) {
          appState.menuId = null;
          render();
        }
        return;
      }

      const { action, id, value } = actionEl.dataset;
      if (action === "back-home") {
        openMainTab("./homepage_preview.html");
        return;
      }
      if (action === "open-editor") {
        openEditor(null);
        return;
      }
      if (action === "toggle-menu") {
        appState.menuId = appState.menuId === id ? null : id;
        render();
        return;
      }
      if (action === "edit") {
        if (suppressedEditId === id) {
          suppressedEditId = null;
          return;
        }
        const item = anniversaries.find(entry => entry.id === id);
        if (item) openEditor(item);
        return;
      }
    });

    document.getElementById("editorCancel").addEventListener("click", closeEditor);
    document.getElementById("editorSave").addEventListener("click", saveEditor);
    document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
    document.getElementById("confirmOk").addEventListener("click", () => {
      if (confirmHandler) confirmHandler();
    });

    document.getElementById("repeatToggle").addEventListener("click", () => {
      appState.repeatYearly = !appState.repeatYearly;
      syncToggle();
    });

    document.getElementById("iconPicker").addEventListener("click", event => {
      const button = event.target.closest("[data-action='pick-icon']");
      if (!button) return;
      appState.iconEmoji = normalizeSceneIcon(button.dataset.value);
      renderIconPicker();
    });

    document.getElementById("reminderRow").addEventListener("click", event => {
      const button = event.target.closest("[data-action='pick-reminder']");
      if (!button) return;
      appState.reminderType = button.dataset.value;
      renderReminderRow();
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".menu-wrap")) {
        const hasMenu = document.querySelector(".menu.show");
        if (hasMenu) {
          appState.menuId = null;
          render();
        }
      }
    });

    const mainTabPageMap = {
      "./homepage_preview.html": "home",
      "./message_wall_preview.html": "messageWall",
      "./wish_list.html": "wishList",
      "./anniversary.html": "anniversary"
    };

    function openMainTab(route) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "secretbase-preview:navigate",
          page: mainTabPageMap[route] || null,
          route
        }, "*");
        return;
      }
      window.location.href = route;
    }

    document.querySelectorAll("[data-main-tab]").forEach(node => {
      node.addEventListener("click", event => {
        event.preventDefault();
        openMainTab(node.dataset.mainTab);
      });
    });

    render();
  </script>
</body>
</html>
